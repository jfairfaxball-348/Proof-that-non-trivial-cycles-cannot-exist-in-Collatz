name: Verify incoming authority

on:
  pull_request:
    paths:
      - "authoritative/**"
      - "tools/rl_conveyor.py"
      - "tools/rl_flat_authority_preflight.py"
      - ".github/workflows/verify-incoming-authority.yml"
  push:
    paths:
      - "authoritative/**"
      - "tools/rl_conveyor.py"
      - "tools/rl_flat_authority_preflight.py"
      - ".github/workflows/verify-incoming-authority.yml"

permissions:
  contents: read

concurrency:
  group: incoming-authority-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Fresh-unpack incoming handover
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify incoming authority
        shell: bash
        run: |
          set -euo pipefail
          if compgen -G 'authoritative/*.zip' > /dev/null || \
             compgen -G 'authoritative/*.zip.sha256' > /dev/null || \
             compgen -G 'authoritative/*_BUNDLE_TRANSPORT' > /dev/null; then
            python3 tools/rl_conveyor.py verify-incoming
          else
            python3 tools/rl_flat_authority_preflight.py
          fi
