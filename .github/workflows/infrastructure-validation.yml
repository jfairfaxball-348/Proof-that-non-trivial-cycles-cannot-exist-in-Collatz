name: Infrastructure validation

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".gitattributes"
      - "AGENTS.md"
      - "CONTRIBUTING.md"
      - "START_HERE.md"
      - "docs/**"
      - "knowledge/**"
      - "tools/**"
      - "tests/**"
  push:
    paths:
      - ".github/workflows/**"
      - ".gitattributes"
      - "AGENTS.md"
      - "CONTRIBUTING.md"
      - "START_HERE.md"
      - "docs/**"
      - "knowledge/**"
      - "tools/**"
      - "tests/**"

permissions:
  contents: read

concurrency:
  group: infrastructure-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

# Full generated-catalogue replay is intentionally not part of every infrastructure
# run. It has its own workflow, triggered only by catalogue/generator surfaces.
